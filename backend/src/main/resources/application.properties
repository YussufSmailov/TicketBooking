spring.application.name=ticket-booking
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/ticket_booking
spring.datasource.username=postgres
spring.datasource.password=12345

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

app.jwt.secret=ticket-booking-kz-student-project-secret-key-change-me-2026
app.jwt.expiration-minutes=1440
app.cors.allowed-origin=http://localhost:5173

app.admin.full-name=Administrator
app.admin.email=admin@ticketbooking.kz
app.admin.phone=+77000000000
app.admin.password=Admin12345

app.demo-user.email=amina@gmail.com
app.demo-user.password=Amina12345

app.booking.reservation-minutes=10
app.booking.max-seats=6

# Локальные настройки почты (логин и пароль SMTP). Файл не попадает в Git, см. backend/mail-local.properties.example.
# Ищется рядом с местом запуска: в папке backend (mvn spring-boot:run) или в корне проекта (IntelliJ).
spring.config.import=optional:file:./mail-local.properties,optional:file:./backend/mail-local.properties

# Почта для кодов подтверждения. Сервер SMTP задаётся переменными окружения
# SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD (см. README).
# Если SPRING_MAIL_HOST не задан, письмо не отправляется, а код пишется в лог backend.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:${spring.mail.username:no-reply@ticketbooking.kz}}

app.verification.code-minutes=15
app.verification.resend-seconds=60
app.verification.max-attempts=5
