# Профиль для хостинга (Railway). Включается переменной SPRING_PROFILES_ACTIVE=prod.
# Все секреты берутся из переменных окружения. Если обязательной переменной нет, backend не запустится.

# Railway сам задаёт порт
server.port=${PORT:8080}

# База: переменные PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD берутся из сервиса Postgres в Railway
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# Таблицы и тестовые данные создаются ОДИН раз, на пустой базе (см. ProdDatabaseInitializer).
# При перезапусках ничего не удаляется.
spring.sql.init.mode=never
spring.jpa.show-sql=false

app.jwt.secret=${APP_JWT_SECRET}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN}
app.admin.password=${APP_ADMIN_PASSWORD}
app.demo-user.password=${APP_DEMO_USER_PASSWORD}

# Почта. Для теста — сервис Mailpit в том же проекте Railway:
#   SPRING_MAIL_HOST=mailpit.railway.internal, SPRING_MAIL_PORT=1025, MAIL_SMTP_AUTH=false, MAIL_SMTP_STARTTLS=false
# Для настоящей почты (Brevo, Gmail) — их SMTP и MAIL_SMTP_AUTH=true, MAIL_SMTP_STARTTLS=true.
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
